<section class="dialog-content">
  <header class="page-header">
    <h2 mat-dialog-title>Accounts</h2>
    <button class="secondary" (click)="dialog.close()">Close</button>
  </header>
  @if (loading) {
    <p role="status">Loading…</p>
  } @else if (error) {
    <p class="error" role="alert">{{ error }}</p>
  } @else {
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Owner</th>
            <th>Type</th>
            <th>Status</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows; track row.id) {
            <tr>
              <td>{{ row.id }}</td>
              <td>{{ row.clientEmail }}</td>
              <td>{{ row.type }}</td>
              <td>{{ row.etat }}</td>
              <td>{{ row.solde | currency: 'USD' }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5">No records yet.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
