name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - name: Frontend unit tests
        run: |
          export CHROME_BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: banking_portal_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-mysql-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: MySQL migrations and integration tests
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/banking_portal_tests?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-only-mysql-password
        run: cd GestionBanque && ./mvnw -B -ntp test
