spring.application.name=banking-portal
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/banking-portal;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
banking.admin.email=${ADMIN_EMAIL:}
banking.admin.password=${ADMIN_PASSWORD:}

banking.auth.max-requests-per-minute=${AUTH_REQUESTS_PER_MINUTE:20}

spring.jackson.deserialization.accept-float-as-int=false
