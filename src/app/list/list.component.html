<section class="dialog-content">
  <header class="page-header">
    <h2 mat-dialog-title>Clients</h2>
    <button class="secondary" (click)="dialog.close()">Close</button>
  </header>
  @if (list.loading) {
    <p role="status">Loading…</p>
  } @else if (list.error) {
    <p class="error" role="alert">{{ list.error }}</p>
  } @else {
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>First name</th>
            <th>Last name</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          @for (row of list.rows; track row.id) {
            <tr>
              <td>{{ row.id }}</td>
              <td>{{ row.prenom }}</td>
              <td>{{ row.nom }}</td>
              <td>{{ row.email }}</td>
              <td>{{ row.role }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5">No records yet.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
  <app-pagination
    [page]="list.page"
    [last]="list.last"
    [busy]="list.loading"
    (pageChange)="list.load($event)"
  />
</section>
